services:
  postgres:
    image: postgres:16-alpine
    container_name: guri24_rms_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rms_password_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-guri24_rms}
      TZ: Africa/Nairobi
    ports:
      - "127.0.0.1:${RMS_POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rms_user} -d ${POSTGRES_DB:-guri24_rms}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: guri24_rms_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:${RMS_REDIS_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: guri24_rms_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_secret_dev_only}
    ports:
      - "127.0.0.1:${RMS_MINIO_API_PORT:-9010}:9000"
      - "127.0.0.1:${RMS_MINIO_CONSOLE_PORT:-9011}:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/Dockerfile.backend
    container_name: guri24_rms_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_PORT: 8085
      SUPABASE_DATABASE_URL: ${SUPABASE_DATABASE_URL:-postgres://${POSTGRES_USER:-rms_user}:${POSTGRES_PASSWORD:-rms_password_dev_only}@postgres:5432/${POSTGRES_DB:-guri24_rms}}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-rms_user}:${POSTGRES_PASSWORD:-rms_password_dev_only}@postgres:5432/${POSTGRES_DB:-guri24_rms}}
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:${RMS_BACKEND_PORT:-8085}:8085"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: ../../infrastructure/docker/Dockerfile.web
    container_name: guri24_rms_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${RMS_WEB_PORT:-5175}:80"
    depends_on:
      - backend

  caddy:
    image: caddy:2-alpine
    container_name: guri24_rms_caddy
    restart: unless-stopped
    ports:
      - "${RMS_CADDY_HTTP_PORT:-8088}:80"
      - "${RMS_CADDY_HTTPS_PORT:-8448}:443"
    volumes:
      - ./infrastructure/docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - web

  prometheus:
    image: prom/prometheus:latest
    container_name: guri24_rms_prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${RMS_PROMETHEUS_PORT:-9095}:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: guri24_rms_grafana
    restart: unless-stopped
    ports:
      - "${RMS_GRAFANA_PORT:-3005}:3000"
    volumes:
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin_dev_only}
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      - prometheus

volumes:
  postgres_data:
  backend_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

name: Guri24 RMS CI Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend-check-and-test:
    name: Rust Backend (Fmt, Clippy, Unit & Acceptance Tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./backend -> target"
      - name: Check formatting
        working-directory: ./backend
        run: cargo fmt --all -- --check
      - name: Run Clippy lints
        working-directory: ./backend
        run: cargo clippy --all-targets -- -D warnings
      - name: Run unit and acceptance tests
        working-directory: ./backend
        run: cargo test --all-targets

  frontend-check-and-test:
    name: Vite Frontend (Typecheck, Vitest & Production Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./apps/web/package-lock.json"
      - name: Install dependencies
        working-directory: ./apps/web
        run: npm install
      - name: TypeScript check
        working-directory: ./apps/web
        run: npm run typecheck
      - name: Run frontend unit & workflow tests
        working-directory: ./apps/web
        run: npm run test
      - name: Build production bundle
        working-directory: ./apps/web
        run: npm run build

[package]
name = "guri24_rms_backend"
version = "1.0.0"
edition = "2021"
authors = ["Guri24 Engineering <engineering@guri24rms.co.ke>"]
description = "Multi-tenant Residential Rental Management System (RMS) Backend for the Kenyan Market"

[lib]
name = "guri24_rms_backend"
path = "src/lib.rs"

[[bin]]
name = "guri24_rms_backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "query"] }
tokio = { version = "1.40", features = ["full"] }
tower = { version = "0.5", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.6", features = ["cors", "trace", "compression-gzip", "set-header", "request-id"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "rust_decimal", "macros", "migrate", "json"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
jsonwebtoken = "9.3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
utoipa = { version = "4.2", features = ["axum_extras", "uuid", "chrono", "decimal"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

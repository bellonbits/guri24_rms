[package]
name = "guri24_rms_backend"
version = "1.0.0"
edition = "2021"
authors = ["Guri24 Engineering <engineering@guri24rms.co.ke>"]
description = "Multi-tenant Residential Rental Management System (RMS) Backend for the Kenyan Market"

[lib]
name = "guri24_rms_backend"
path = "src/lib.rs"

[[bin]]
name = "guri24_rms_backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "json", "query"] }
tokio = { version = "1.40", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.36", features = ["serde", "serde-with-str", "maths"] }
rust_decimal_macros = "1.36"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["getrandom"] }
jsonwebtoken = "9.3"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
thiserror = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
